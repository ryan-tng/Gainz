# Render blueprint — deploy with one click from the repo.
# Dashboard → New → Blueprint → pick this repo. Root dir: ml
services:
  - type: web
    name: gainz-ml
    runtime: python
    plan: free
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ML_ALLOW_ORIGIN
        value: "*"
